services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: aisevak
      POSTGRES_USER: aisevak
      POSTGRES_PASSWORD: aisevak
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18 stores PGDATA under /var/lib/postgresql/18/docker.
      # scripts/install.sh migrates existing legacy-mounted clusters before this remount.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aisevak -d aisevak"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://aisevak:aisevak@postgres:5432/aisevak
      API_HOST: 0.0.0.0
      API_PORT: 8787
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - /srv/aisevak:/srv/aisevak

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  postgres-data:
