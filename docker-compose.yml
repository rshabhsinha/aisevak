services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: aisevak
      POSTGRES_USER: aisevak
      POSTGRES_PASSWORD: aisevak
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18 stores PGDATA under /var/lib/postgresql/18/docker.
      # scripts/install.sh migrates existing legacy-mounted clusters before this remount.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aisevak -d aisevak"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    user: "${AISEVAK_RUNNER_UID:-1000}:${AISEVAK_RUNNER_GID:-1000}"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgres://aisevak:aisevak@postgres:5432/aisevak
      API_HOST: 0.0.0.0
      API_PORT: 8787
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:5173}
      COOKIE_SECRET: ${COOKIE_SECRET:?COOKIE_SECRET must be set}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      MANAGED_ROOT: /srv/aisevak
      CODEX_BINARY: ${CODEX_BINARY:-auto}
      CURSOR_BINARY: ${CURSOR_BINARY:-auto}
      OPENCODE_BINARY: ${OPENCODE_BINARY:-auto}
      CODEX_DEFAULT_MODEL: ${CODEX_DEFAULT_MODEL:-gpt-5.6-luna}
      CODEX_OAUTH_CLIENT_ID: ${CODEX_OAUTH_CLIENT_ID:-}
      GITHUB_HOST: ${GITHUB_HOST:-github.com}
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      # The API only needs the shared skill catalog and its disposable probe
      # output. AWS credentials, workspaces, Codex homes, and runner state
      # remain host-runner-only.
      - /srv/aisevak/skills:/srv/aisevak/skills
      - /srv/aisevak/probe-schema:/srv/aisevak/probe-schema
      # Host-published harness CLIs (read-only) so status probes and model
      # discovery inside the container see the same binaries as the runner.
      - /opt/aisevak/harness-bin:/opt/aisevak/harness-bin:ro

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  postgres-data:
