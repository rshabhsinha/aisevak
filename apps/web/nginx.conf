server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    # Chat attachments are sent base64-encoded: 20 MB files plus encoding overhead.
    client_max_body_size 30m;
    # Resolve the api container per request via Docker's DNS. A literal
    # hostname is resolved once at startup, so recreating the api container
    # left nginx proxying to its old IP (502s) until web was restarted.
    # With a variable and no URI part, the original /api/... URI passes through.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream api:8787;
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri /index.html;
  }
}
